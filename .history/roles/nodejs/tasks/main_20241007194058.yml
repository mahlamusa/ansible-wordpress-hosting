- name: Deploy NodeJS Web App
  synchronize:
    src: /home/mahlamusa/APPS/Docker/wordpress-nginx/web/
    dest: /usr/share/nginx/html/
  become: yes
  become_user: root

- name: Install NodeJS
  apt:
    name:
      - nodejs
      - npm
    state: present

- name: Install PM2
  npm:
    name: pm2
    global: yes
    state: present
  become: yes
  become_user: sitemanager

- name: Install npm packages
  command:
    chdir: /usr/share/nginx/html
    cmd: npm install

- name: Run the App
  command:
    chdir: /usr/share/nginx/html
    cmd: npm run serve

