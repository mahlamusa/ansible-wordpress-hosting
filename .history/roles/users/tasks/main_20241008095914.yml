---
- name: Ensure sudo group is present
  group:
    name: sudo
    state: present

- name: Ensure sudo group has sudo privileges
  lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: "^%sudo"
    line: "%sudo ALL=(ALL:ALL) ALL"
    validate: "/usr/sbin/visudo -cf %s"

- name: Create SiteManager account with autogenerated password and ssh key
  user:
    name: sitemanager
    groups:
      - sudo
      - www-data
    password: $6$7QIpE/6kKVGozK5b$/l.oT3ExWEofU4en35CZDm7B098Fb.SlXOo/pSeHkS4gRWKWu4LWgU0EG/redfZws9sunolXunwLV5MQ0CAVK/
    shell: /bin/bash
    update_password: always
    generate_ssh_key: true
    ssh_key_file: .ssh/id_rsa_sitemanager
    state: present

- name: Create mahlamusa account with autogenerated password and ssh key
  user:
    name: mahlamusa
    groups:
      - sudo
      - www-data
    password: $6$7QIpE/6kKVGozK5b$/l.oT3ExWEofU4en35CZDm7B098Fb.SlXOo/pSeHkS4gRWKWu4LWgU0EG/redfZws9sunolXunwLV5MQ0CAVK/
    shell: /bin/bash
    update_password: always
    generate_ssh_key: true
    ssh_key_file: .ssh/id_rsa_mahlamusa
    state: present
    
- name: Create sudoers file for sitemanager
  file:
    path: "/etc/sudoers.d/sitemanager-user"
    state: touch

- name: Create sudoers file for mahlamusa
  file:
    path: "/etc/sudoers.d/mahlamusa-user"
    state: touch

- name: Enable passwordless sudo for sitemanager user
  lineinfile:
    dest: "/etc/sudoers.d/sitemanager-user"
    regexp: "^sitemanager"
    line: "sitemanager ALL=(ALL) NOPASSWD:ALL"
    state: present
    
- name: Enable passwordless sudo for mahlamusa
  lineinfile:
    dest: "/etc/sudoers.d/mahlamusa-user"
    regexp: "^mahlamusa"
    line: "mahlamusa ALL=(ALL) NOPASSWD:ALL"
    state: present

- name: Addd authorised key for sitemanager
  authorized_key:
    user: sitemanager
    key: "{{ lookup('file', '.ssh/id_rsa_sitemanager.pub') }}"

- name: Addd authorised key for mahlamusa
  authorized_key:
    user: mahlamusa 
    key: "{{ lookup('file', '.ssh/id_rsa_mahlamusa.pub') }}"
