---
- name: Get certificates for given hostnames
  hosts: dev
  become: true
  tasks:
    - name: Check certbot_domains is set
      ansible.builtin.assert:
        that: certbot_domains | length > 0
        fail_msg: Set certbot_domains, e.g. -e '{"certbot_domains":["example.com"]}'

    - name: Get certificates for hostnames
      ansible.builtin.command: >-
        certbot certonly --nginx --non-interactive --agree-tos
        --email {{ certbot_email }} -d {{ item }}
      args:
        creates: /etc/letsencrypt/live/{{ item }}
      loop: "{{ certbot_domains }}"
