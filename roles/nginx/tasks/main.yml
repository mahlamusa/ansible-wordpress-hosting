---
- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Back up the original nginx directory once
  ansible.builtin.command: cp -a /etc/nginx /etc/nginx.orig
  args:
    creates: /etc/nginx.orig

- name: Copy nginx config
  ansible.builtin.copy:
    src: "{{ role_path }}/nginx/"
    dest: /etc/nginx/
    mode: preserve
  notify: Reload nginx

- name: Create upstreams directory
  ansible.builtin.file:
    path: /etc/nginx/upstreams
    state: directory
    mode: "0755"

- name: Configure nginx and the PHP upstream
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: nginx.conf.j2, dest: /etc/nginx/nginx.conf }
    - { src: php-pool.conf.j2, dest: /etc/nginx/global/php-pool.conf }
  notify: Restart nginx

- name: Symlink default site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/default
    dest: /etc/nginx/sites-enabled/default
    state: link
    force: true
  notify: Reload nginx

- name: Validate nginx config
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
