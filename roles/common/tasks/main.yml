---
- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: safe
    update_cache: true
    cache_valid_time: 300

- name: Install base packages
  ansible.builtin.apt:
    name:
      - acl
      - at
      - ca-certificates
      - curl
      - fail2ban
      - git
      - jq
      - redis-server
      - rsync
      - unzip
    state: present

- name: Enable base services
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - fail2ban
    - redis-server
