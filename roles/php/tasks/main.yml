---
- name: Install PHP
  ansible.builtin.apt:
    name:
      - php-bcmath
      - php-cli
      - php-common
      - php-curl
      - php-fpm
      - php-gd
      - php-igbinary
      - php-imagick
      - php-intl
      - php-mbstring
      - php-mysql
      - php-redis
      - php-soap
      - php-xml
      - php-xmlrpc
      - php-zip
    state: present

# Ubuntu ships one PHP version per release (8.3 on 24.04, 8.5 on 26.04).
- name: Detect PHP version
  ansible.builtin.command: php -r 'echo PHP_MAJOR_VERSION . "." . PHP_MINOR_VERSION;'
  register: php_version_cmd
  changed_when: false

- name: Set PHP version fact
  ansible.builtin.set_fact:
    php_version: "{{ php_version_cmd.stdout }}"

- name: Set PHP-FPM pool user and group
  ansible.builtin.lineinfile:
    dest: "/etc/php/{{ php_version }}/fpm/pool.d/www.conf"
    regexp: "^{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: user, value: "{{ web_user }}" }
    - { key: group, value: "{{ web_user }}" }
    - { key: listen.owner, value: "{{ web_user }}" }
    - { key: listen.group, value: "{{ web_user }}" }
  notify: Restart php

- name: Set PHP upload limits
  ansible.builtin.lineinfile:
    dest: "/etc/php/{{ php_version }}/fpm/php.ini"
    regexp: "^;?{{ item.key }}\\s*="
    line: "{{ item.key }} = {{ item.value }}"
    state: present
  loop:
    - { key: upload_max_filesize, value: "{{ php_upload_max_filesize }}" }
    - { key: post_max_size, value: "{{ php_post_max_size }}" }
  notify: Reload php

- name: Enable PHP-FPM
  ansible.builtin.service:
    name: "php{{ php_version }}-fpm"
    state: started
    enabled: true
