---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH, HTTP and HTTPS
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"
  when: ufw_enabled | bool

# Enabled last so the SSH rule exists before incoming traffic is denied.
- name: Enable firewall with default deny
  community.general.ufw:
    state: enabled
    policy: deny
  when: ufw_enabled | bool
