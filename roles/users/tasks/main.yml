---
- name: Create admin users
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups:
      - sudo
      - www-data
    append: true
    shell: /bin/bash
    state: present
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Add authorized keys for admin users
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.public_key }}"
    state: present
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Enable passwordless sudo for admin users
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ item.name }}-user"
    content: "{{ item.name }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"
