---
- name: Install OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

- name: Check an admin user exists before root login is disabled
  ansible.builtin.assert:
    that: admin_users | length > 0
    fail_msg: Add at least one entry to admin_users before disabling root SSH login.
  when: ssh_disable_root_login | bool

# A drop-in is used because sshd keeps the first value it reads, and cloud
# images ship sshd_config.d/50-cloud-init.conf with PasswordAuthentication yes.
- name: Harden SSH
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    content: |
      PermitRootLogin {{ 'no' if ssh_disable_root_login | bool else 'prohibit-password' }}
      PasswordAuthentication no
      KbdInteractiveAuthentication no
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh
