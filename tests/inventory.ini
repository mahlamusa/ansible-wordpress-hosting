# Test inventory for the throwaway containers started by tests/run.sh.
[dev]
ubuntu2404 ansible_port=2224
ubuntu2604 ansible_port=2226

[dev:vars]
ansible_host=127.0.0.1
ansible_user=root
ansible_ssh_private_key_file=tests/id_test
ansible_ssh_common_args=-o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
